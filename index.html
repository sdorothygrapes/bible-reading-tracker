<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0c">
<title>Bible Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#161618;--tx:#fff;--sub:#9a9aa1;--ac:#9999ff;--line:#2a2a2e;
--u:#2c2c30;--ut:#fff;--r:#7B68EE;--rt:#0b0b0c;--s:#5454ff;--st:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 110px}
h1{font-size:34px;line-height:1.1;margin:2px 0 14px;font-weight:700;letter-spacing:-.5px}
p{margin:0}.sub{color:var(--sub);font-size:13px}.ref{font-size:18px;font-weight:600;margin-top:2px}
.hint{color:var(--sub);font-size:13px;margin:12px 4px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.row>:last-child{margin-left:auto}.between{justify-content:space-between}
.chips{display:flex;gap:10px;margin-bottom:14px}
.chip{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--sub);border:1px solid var(--line)}
.chip b{display:block;font-size:22px;color:var(--ac)}
.s0{background:var(--u);color:var(--ut)}.s1{background:var(--r);color:var(--rt)}.s2{background:var(--s);color:var(--st)}
.pill{min-width:98px;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cell{height:42px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-weight:500;font-size:14px;cursor:pointer;padding:0}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.strip i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);display:block}
select{width:100%;font-family:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-family:inherit;font-weight:500;font-size:14px}
.seg button.on{background:var(--ac);color:#0b0b0c;border-color:var(--ac)}
.link{background:none;border:0;padding:0;font-family:inherit;font-weight:600;font-size:16px;color:var(--tx);cursor:pointer}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 4px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:none;border:0;padding:12px 0;font-family:inherit;font-weight:500;font-size:14px;color:var(--sub);cursor:pointer}
nav button.on{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.92}
input{display:block;width:100%;font-family:inherit;font-size:16px;padding:12px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.auth .brand img{width:74px;height:auto;flex:none}
.auth h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:26px;line-height:1.05;margin:0}
.auth .tag{font-style:italic;font-weight:700;font-size:24px;line-height:1.05;color:var(--ac);margin:-1px 0 0}
.auth p{line-height:1.65;margin-bottom:12px}
.auth a{color:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;margin-bottom:12px}
.tile{aspect-ratio:1;border:1px solid var(--line);border-radius:7px}
.h2{font-family:inherit;font-size:20px;font-weight:700;margin:22px 0 10px}
.big{text-align:center;padding:22px 16px}.big .num{font-size:64px;font-weight:700;line-height:1;color:var(--ac);margin:4px 0}.big .num span{font-size:20px;color:var(--sub);font-weight:500}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:10px}
.dots i{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);display:block}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav>
<button data-a="tab" data-v="today" id="n-today">Today</button>
<button data-a="tab" data-v="lib" id="n-lib">Library</button>
<button data-a="tab" data-v="prog" id="n-prog">Progress</button>
<button data-a="tab" data-v="streak" id="n-streak">Streaks</button>
</nav>
<div id="toast"></div>
<script>
const SUPABASE_URL='https://gzwdourptipoywnfdrle.supabase.co';
const SUPABASE_KEY='sb_publishable_HDpa30Nc7RppbsidTuBrTw_4DkssQda';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BOOKS='Genesis:50,Exodus:40,Leviticus:27,Numbers:36,Deuteronomy:34,Joshua:24,Judges:21,Ruth:4,1 Samuel:31,2 Samuel:24,1 Kings:22,2 Kings:25,1 Chronicles:29,2 Chronicles:36,Ezra:10,Nehemiah:13,Esther:10,Job:42,Psalms:150,Proverbs:31,Ecclesiastes:12,Song of Solomon:8,Isaiah:66,Jeremiah:52,Lamentations:5,Ezekiel:48,Daniel:12,Hosea:14,Joel:3,Amos:9,Obadiah:1,Jonah:4,Micah:7,Nahum:3,Habakkuk:3,Zephaniah:3,Haggai:2,Zechariah:14,Malachi:4,Matthew:28,Mark:16,Luke:24,John:21,Acts:28,Romans:16,1 Corinthians:16,2 Corinthians:13,Galatians:6,Ephesians:6,Philippians:4,Colossians:4,1 Thessalonians:5,2 Thessalonians:3,1 Timothy:6,2 Timothy:4,Titus:3,Philemon:1,Hebrews:13,James:5,1 Peter:5,2 Peter:3,1 John:5,2 John:1,3 John:1,Jude:1,Revelation:22'
.split(',').map(x=>{const i=x.lastIndexOf(':');return{n:x.slice(0,i),c:+x.slice(i+1)}});
const PV=[33,22,35,27,23,35,27,36,18,32,31,28,25,35,33,33,28,24,29,30,31,29,35,34,28,28,27,28,27,33,31];
const OT=BOOKS.slice(0,39),NT=BOOKS.slice(39),TOT=BOOKS.reduce((a,b)=>a+b.c,0);
const NAMES=['Unread','Read','Studied'];
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.log||'{}'),user=null,tab='today',cur='Genesis',seg='all',ready=!!localStorage.log;

const ds=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const key=(b,c,v)=>b+'|'+c+'|'+(v||'');
const st=(b,c,v)=>(S[key(b,c,v)]||{}).status|0;
const rng=(v,n)=>{const e=Math.min(v+1,n);return e>v?v+'-'+e:''+v};
function chSt(b,c){const w=st(b,c);if(w||b!=='Proverbs')return w;const n=PV[c-1],a=[];
 for(let v=1;v<=n;v+=2)a.push(st(b,c,rng(v,n)));
 return a.every(x=>x)?Math.min(...a):a.some(x=>x)?1:0}
const cs=(b,c,v)=>v?st(b,c,v):chSt(b,c);
const lbl=i=>i.book+' '+i.ch+(i.v?':'+i.v:'');

function nextCh(list){for(const b of list)for(let c=1;c<=b.c;c++)if(!chSt(b.n,c))return{book:b.n,ch:c,v:''};return null}
function nextProv(){for(let c=1;c<=31;c++){if(st('Proverbs',c))continue;const n=PV[c-1];
 for(let v=1;v<=n;v+=2)if(!st('Proverbs',c,rng(v,n)))return{book:'Proverbs',ch:c,v:rng(v,n)}}return null}
function plan(){const d=ds(),p=JSON.parse(localStorage.plan||'null');if(p&&p.d===d)return p.i;
 const skip=b=>b.n!=='Psalms'&&b.n!=='Proverbs';
 const i=[['Old Testament',nextCh(OT.filter(skip))],['New Testament',nextCh(NT)],['Psalm',nextCh([{n:'Psalms',c:150}])],['Proverbs',nextProv()]]
  .filter(x=>x[1]).map(([s,x])=>({s,...x}));
 localStorage.plan=JSON.stringify({d,i});return i}
const AB='Gen Exo Lev Num Deu Jos Jdg Rut 1Sa 2Sa 1Ki 2Ki 1Ch 2Ch Ezr Neh Est Job Psa Pro Ecc Sos Isa Jer Lam Eze Dan Hos Joe Amo Oba Jon Mic Nah Hab Zep Hag Zec Mal Mat Mar Luk Joh Act Rom 1Co 2Co Gal Eph Php Col 1Th 2Th 1Ti 2Ti Tit Phm Heb Jas 1Pe 2Pe 1Jn 2Jn 3Jn Jud Rev'.split(' ');
BOOKS.forEach((b,i)=>b.ab=AB[i]);
let D=new Set(JSON.parse(localStorage.days||'[]'));
const dn=x=>{const [y,m,d]=x.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
function allDays(){const x=new Set(D);Object.values(S).forEach(v=>{if(v.status>0&&v.updated)x.add(v.updated)});return x}
function streaks(){const a=[...allDays()].map(dn).sort((p,q)=>p-q);let best=0,run=0,prev=null;
 for(const n of a){run=prev!==null&&n===prev+1?run+1:1;if(run>best)best=run;prev=n}
 const set=new Set(a);let t=dn(ds()),cur=0;if(!set.has(t))t--;while(set.has(t)){cur++;t--}
 return{cur,best,total:a.length,set}}
function logDay(){const d=ds();if(D.has(d))return;D.add(d);localStorage.days=JSON.stringify([...D]);
 sb.from('reading_days').upsert({user_id:user.id,day:d},{onConflict:'user_id,day'}).then(()=>{})}
async function loadDays(){try{let all=[],from=0;
 for(;;){const {data,error}=await sb.from('reading_days').select('day').order('day').range(from,from+999);
  if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
 D=new Set(all.map(x=>x.day));localStorage.days=JSON.stringify([...D])}catch(e){}}

const pill=(b,c,v)=>{const s=cs(b,c,v);return `<button class="pill s${s}" data-a="cyc" data-b="${b}" data-c="${c}" data-v="${v||''}">${NAMES[s]}</button>`};
const legend=()=>'<div class="leg"><span><i class="s0"></i>Unread</span><span><i class="s1"></i>Read</span><span><i class="s2"></i>Studied</span></div>';

function today(){
 if(!ready)return '<h1>Today</h1><p class="hint">Loading your reading log...</p>';
 const items=plan(),dt=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 const done=items.filter(i=>cs(i.book,i.ch,i.v)>0).length;
 return `<p class="sub">${dt}</p><h1>Today</h1>
 <div class="chips"><div class="chip"><b>${streaks().cur}</b>day streak</div><div class="chip"><b>${done}/${items.length}</b>read today</div></div>`
 +items.map(i=>`<div class="card row"><div><p class="sub">${i.s}</p><p class="ref">${lbl(i)}</p></div>${pill(i.book,i.ch,i.v)}</div>`).join('')
 +'<p class="hint">Tap a button to go from Unread to Read to Studied. Reading somewhere else today? Log it in the Library tab.</p>'}

function lib(){
 const o=g=>g.map(b=>`<option${b.n===cur?' selected':''}>${b.n}</option>`).join('');
 const b=BOOKS.find(x=>x.n===cur);let cells='';
 for(let c=1;c<=b.c;c++)cells+=`<button class="cell s${chSt(cur,c)}" data-a="cyc" data-b="${cur}" data-c="${c}" data-v="">${c}</button>`;
 return `<h1>Library</h1><select id="sel" aria-label="Book"><optgroup label="Old Testament">${o(OT)}</optgroup><optgroup label="New Testament">${o(NT)}</optgroup></select>
 <div class="card"><div class="grid">${cells}</div></div>${legend()}
 <p class="hint">${cur==='Proverbs'?'Tapping a chapter here logs the whole chapter. For 2-verse daily reading, use the Today tab.':'Tap any chapters you read, in any order. Tap again to mark them Studied.'}</p>`}

function frac(b,c){const w=st(b,c);if(w||b!=='Proverbs')return[w>0?1:0,w==2?1:0];
 const n=PV[c-1];let k=0,r=0,q=0;for(let v=1;v<=n;v+=2){k++;const x=st(b,c,rng(v,n));if(x)r++;if(x==2)q++}return[r/k,q/k]}
function bstat(b){let r=0,q=0;for(let c=1;c<=b.c;c++){const f=frac(b.n,c);r+=f[0];q+=f[1]}
 return{r,q,pr:Math.round(r/b.c*100),ps:Math.round(q/b.c*100)}}
function prog(){
 const L=seg==='ot'?OT:seg==='nt'?NT:BOOKS;let r=0,q=0,tot=0,lr=0,lq=0,lt=0;
 BOOKS.forEach(b=>{const x=bstat(b);r+=x.r;q+=x.q;tot+=b.c});
 L.forEach(b=>{const x=bstat(b);lr+=x.r;lq+=x.q;lt+=b.c});
 const pc=(a,t)=>Math.round(a/t*100);
 const tiles=L.map(b=>{const x=bstat(b);
  const bg=`linear-gradient(to top,var(--s) 0,var(--s) ${x.ps}%,var(--r) ${x.ps}%,var(--r) ${x.pr}%,var(--u) ${x.pr}%,var(--u) 100%)`;
  return `<div class="tile" style="background:${bg}" role="img" aria-label="${b.n}: ${x.pr}% read, ${x.ps}% studied"></div>`}).join('');
 const detail=L.map(b=>{let rd=0,cells='';for(let c=1;c<=b.c;c++){const x=chSt(b.n,c);if(x)rd++;cells+=`<i class="s${x}"></i>`}
  return `<div class="card"><div class="row between"><button class="link" data-a="open" data-b="${b.n}">${b.n}</button><span class="sub">${rd} of ${b.c}</span></div><div class="strip">${cells}</div></div>`}).join('');
 return `<h1>Progress</h1><div class="chips"><div class="chip"><b>${pc(r,tot)}%</b>of the Bible read</div><div class="chip"><b>${pc(q,tot)}%</b>studied</div></div>
 <div class="seg"><button class="${seg==='all'?'on':''}" data-a="seg" data-v="all">Full Bible</button><button class="${seg==='ot'?'on':''}" data-a="seg" data-v="ot">Old Testament</button><button class="${seg==='nt'?'on':''}" data-a="seg" data-v="nt">New Testament</button></div>
 ${seg==='all'?'':`<p class="sub" style="margin:0 2px 10px">${seg==='ot'?'Old':'New'} Testament: ${pc(lr,lt)}% read, ${pc(lq,lt)}% studied.</p>`}
 <div class="tiles">${tiles}</div>${legend()}
 <p class="hint">Each square is one book, in Bible order. It fills from the bottom: dark is studied, light is read.</p>
 <h2 class="h2">Chapter detail</h2>${detail}${legend()}<p style="margin:16px 0"><button class="pill s0" data-a="out">Sign out</button></p>`}

function streakTab(){
 const k=streaks(),base=dn(ds());let dots='';
 for(let i=27;i>=0;i--)dots+=`<i class="${k.set.has(base-i)?'s2':'s0'}"></i>`;
 return `<h1>Streaks</h1>
 <div class="card big"><p class="sub">Current streak</p><p class="num">${k.cur}<span> ${k.cur===1?'day':'days'}</span></p></div>
 <div class="chips"><div class="chip"><b>${k.best}</b>longest streak</div><div class="chip"><b>${k.total}</b>days logged</div></div>
 <div class="card"><p class="sub">Last 28 days</p><div class="dots">${dots}</div></div>
 <p class="hint">A day counts when you log at least one chapter. Miss a day and your current streak starts over, but your longest streak stays.</p>`}

function render(){
 document.querySelector('nav').style.display=user?'flex':'none';
 if(!user){$('app').innerHTML=authView();return}
 $('app').innerHTML=tab==='today'?today():tab==='lib'?lib():tab==='streak'?streakTab():prog();
 ['today','lib','prog','streak'].forEach(t=>$('n-'+t).className=t===tab?'on':'')}

<p>You're signing up for free use of The Grapeful Project's Bible Reading Tracker.</p>
<p>I'm a serial dopamine-chaser who wants a companion to allow me to read the Bible at random while keeping track of my progress (hello dopamiiine!).</p>

async function send(o){
 const {error}=await sb.from('log').upsert({user_id:user.id,book:o.book,chapter:o.chapter,verses:o.verses,status:o.status,updated:o.date},{onConflict:'user_id,book,chapter,verses'});
 toast(error?"Couldn't save. Check your connection.":'Saved')}
function setSt(b,c,v,s){S[key(b,c,v)]={status:s,updated:ds()};localStorage.log=JSON.stringify(S);if(s>0)logDay();render();send({book:b,chapter:c,verses:v||'',status:s,date:ds()})}
async function load(){
 try{let all=[],from=0;
  for(;;){const {data,error}=await sb.from('log').select('book,chapter,verses,status,updated').order('book').order('chapter').order('verses').range(from,from+999);
   if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
  const m={};all.forEach(x=>m[key(x.book,x.chapter,x.verses)]={status:x.status,updated:x.updated});S=m;localStorage.log=JSON.stringify(S)}
 catch(e){toast('Offline: showing your last saved log')}
 await loadDays();
 ready=true;render()}
async function auth(up){
 const email=$('em').value.trim(),password=$('pw').value;
 const {data,error}=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(error)return toast(error.message);
 if(!data.session)return toast('Check your email to confirm, then sign in');
 user=data.session.user;ready=false;render();load();toast(up?'Account created. Welcome!':'Signed in')}
async function out(){await sb.auth.signOut();localStorage.clear();S={};D=new Set();user=null;ready=false;render()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,b=t.dataset.b,c=+t.dataset.c,v=t.dataset.v;
 if(a==='cyc')setSt(b,c,v,(cs(b,c,v)+1)%3);
 else if(a==='tab'){tab=v;render();scrollTo(0,0)}
 else if(a==='seg'){seg=v;render()}
 else if(a==='open'){cur=b;tab='lib';render();scrollTo(0,0)}
 else if(a==='in'||a==='up')auth(a==='up');
 else if(a==='out')out()});
document.addEventListener('change',e=>{if(e.target.id==='sel'){cur=e.target.value;render()}});

render();
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;render();if(user)load()});
</script>
